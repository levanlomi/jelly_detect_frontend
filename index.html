<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jellyfish Detector Da Nang</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgBase: 'var(--tg-theme-bg-color, #f5f7fa)',
                        tgText: 'var(--tg-theme-text-color, #1a202c)',
                        tgCard: 'var(--tg-theme-secondary-bg-color, #ffffff)',
                        tgButton: 'var(--tg-theme-button-color, #3b82f6)',
                        tgButtonText: 'var(--tg-theme-button-text-color, #ffffff)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f5f7fa);
            color: var(--tg-theme-text-color, #1a202c);
            transition: background-color 0.3s, color 0.3s;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(128, 128, 128, 0.1);
        }
        .btn-primary {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
            border-radius: 16px;
        }
        .animate-pulse-fast { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        .danger-low { color: #10B981; } 
        .danger-med { color: #F59E0B; } 
        .danger-high { color: #EF4444; } 

        /* Анимации фона */
        @keyframes floatJelly {
            0% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0.15; }
            50% { transform: translateY(-10px) translateX(5px) rotate(5deg); opacity: 0.35; }
            100% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0.15; }
        }
        .floating-jelly {
            position: absolute;
            animation: floatJelly 4s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
        }
        
        @keyframes windMove {
            0% { transform: translateX(100%); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateX(-100%); opacity: 0; }
        }
        .wind-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(156, 163, 175, 0.4), transparent);
            animation: windMove 3s linear infinite;
            pointer-events: none;
        }
        
        .moon-bg {
            position: absolute;
            right: -20px;
            top: -20px;
            font-size: 140px;
            opacity: 0.04;
            pointer-events: none;
            user-select: none;
            animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold font-sans tracking-tight" id="app-title">Jellyfish Detector Da Nang</h1>
        <div class="flex gap-2">
            <button id="lang-toggle" class="p-2 card text-sm font-bold shadow-sm transition active:scale-95">EN</button>
            <button id="theme-toggle" class="p-2 card shadow-sm transition active:scale-95">🌙</button>
        </div>
    </div>

    <div class="card w-full max-w-md p-6 pt-5 pb-6 flex flex-col items-center mb-6 relative overflow-hidden">
        
        <div id="ambient-bg" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

        <div class="w-full flex justify-center items-center relative z-10 mb-2">
            <h2 id="status-title" class="text-base font-bold opacity-60 uppercase tracking-widest">Danger Level</h2>
        </div>
        
        <div id="loading-state" class="flex flex-col items-center py-8 relative z-10">
            <div class="w-16 h-16 rounded-full border-4 border-gray-200 border-t-blue-500 animate-spin mb-4"></div>
            <p id="loading-text" class="text-sm opacity-60 animate-pulse-fast">Scanning radars...</p>
        </div>

        <div id="result-state" class="hidden flex flex-col items-center w-full relative z-10">
            <div class="text-7xl font-black mb-4 tracking-tighter" id="danger-score">--</div>
            <div class="text-xs px-3 py-1 rounded-full font-medium mb-4 shadow-sm uppercase tracking-wide" id="danger-badge">Analyzing...</div>
            
            <p class="text-center text-sm font-medium px-2 opacity-90 mb-6" id="danger-desc">--</p>

            <div class="w-full text-left mt-2">
                <p class="text-[11px] font-bold opacity-40 uppercase tracking-wider mb-3 pl-1" id="how-it-works-title">Как работает оценка (4 фактора)</p>
                <div class="space-y-2" id="factors-accordion">
                    </div>
            </div>
        </div>
    </div>

    <div class="card w-full max-w-md p-6 flex flex-col items-center relative z-10">
        <p id="report-prompt" class="text-center mb-4 text-sm font-medium">Did you spot a jellyfish at the beach today?</p>
        <button id="report-btn" class="btn-primary w-full py-3.5 font-bold text-lg transition active:scale-95 shadow-md">
            🚨 Report Jellyfish
        </button>
        <p id="report-thanks" class="text-green-500 text-sm mt-3 hidden font-medium transition-opacity">Thanks! Report recorded in radar.</p>
    </div>

    <template id="accordion-item-template">
        <div class="bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 overflow-hidden transition-all">
            <button class="w-full flex justify-between items-center p-3 text-sm font-bold opacity-80 hover:opacity-100 transition focus:outline-none" onclick="this.nextElementSibling.classList.toggle('hidden')">
                <span class="factor-icon-name flex items-center gap-2"></span>
                <div class="flex items-center gap-2">
                    <span class="factor-val text-xs"></span>
                    <span class="text-gray-400 text-[10px]">▼</span>
                </div>
            </button>
            <div class="hidden px-3 pb-3 pt-1 text-[12px] opacity-70 leading-relaxed factor-desc">
                </div>
        </div>
    </template>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Адрес бэкенда на Render.com
        const API_URL = 'https://jellyfish-backend-2p8f.onrender.com'; 

        const translations = {
            ru: {
                title: "Jellyfish Detector Da Nang",
                statusTitle: "Уровень опасности",
                loading: "Проверяем радары...",
                prompt: "Видели сегодня медузу на пляже?",
                btnReport: "🚨 Я видел медузу",
                btnThanks: "Спасибо! Ваш отчет учтен в радаре.",
                low: "Безопасно",
                med: "Будьте внимательны",
                high: "Апокалипсис",
                descLow: "Море полностью безопасно для купания. Отличное время, чтобы поплавать!",
                descMed: "Купаться можно, но посматривайте по сторонам. Возможны редкие медузы.",
                descHigh: "Настоящий медузий апокалипсис! Заходить в воду крайне не рекомендуется.",
                
                howItWorks: "Как работает оценка",
                fSeason: "📅 Сезон",
                fWind: "💨 Ветер",
                fMoon: "🌕 Луна",
                fReports: "🚨 Отчеты",
                
                seasonHighDesc: "С мая по сентябрь во Вьетнаме активный сезон. Исторически медуз в этот период больше всего.",
                seasonLowDesc: "Сейчас низкий сезон. Базовая вероятность встретить медуз минимальна.",
                windBadDesc: "Ветер дует с моря и прибивает теплые верхние слои воды с медузами прямо к берегу.",
                windGoodDesc: "Направление ветра безопасное. Он дует с берега, отгоняя медуз дальше в море.",
                moonBadDesc: "Сизигийный прилив (новолуние или полнолуние). Сильные изменения уровня воды несут медуз к пляжу.",
                moonGoodDesc: "Обычная фаза луны. Приливы сейчас стабильные и не провоцируют выброс медуз.",
                reportsDesc: "Количество людей, которые нажали кнопку 'Я видел медузу' за последние 24 часа."
            },
            en: {
                title: "Jellyfish Detector Da Nang",
                statusTitle: "Danger Level",
                loading: "Scanning radars...",
                prompt: "Did you spot a jellyfish at the beach today?",
                btnReport: "🚨 I saw a jellyfish",
                btnThanks: "Thanks! Report recorded in radar.",
                low: "Safe",
                med: "Be Careful",
                high: "Apocalypse",
                descLow: "The sea is perfectly safe for swimming. Great time to go to the beach!",
                descMed: "Swimming is fine, but keep an eye out. Single jellyfish are possible.",
                descHigh: "True jellyfish apocalypse! Swimming is strongly discouraged.",
                
                howItWorks: "How it works",
                fSeason: "📅 Season",
                fWind: "💨 Wind",
                fMoon: "🌕 Moon",
                fReports: "🚨 Reports",
                
                seasonHighDesc: "May to September is the active season in Vietnam. Historically, there are more jellyfish.",
                seasonLowDesc: "It's low season. The base probability of encountering jellyfish is minimal.",
                windBadDesc: "The wind is blowing from the sea, pushing the warm upper layers of water and jellyfish to the shore.",
                windGoodDesc: "Safe wind direction. It blows from the shore, driving jellyfish away into the sea.",
                moonBadDesc: "Spring tide (new or full moon). Strong water level changes carry jellyfish to the beach.",
                moonGoodDesc: "Normal moon phase. Tides are stable and don't provoke jellyfish washing ashore.",
                reportsDesc: "Number of people who clicked 'I saw a jellyfish' in the last 24 hours."
            }
        };

        let currentLang = tg?.initDataUnsafe?.user?.language_code === 'ru' ? 'ru' : 'en';
        let isDark = tg.colorScheme === 'dark';
        if (localStorage.getItem('theme')) isDark = localStorage.getItem('theme') === 'dark';
        
        let cachedData = null;

        function applyTheme() {
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.body.style.setProperty('--tg-theme-bg-color', '#1a202c');
                document.body.style.setProperty('--tg-theme-secondary-bg-color', '#2d3748');
                document.body.style.setProperty('--tg-theme-text-color', '#f5f7fa');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.style.setProperty('--tg-theme-bg-color', '#f5f7fa');
                document.body.style.setProperty('--tg-theme-secondary-bg-color', '#ffffff');
                document.body.style.setProperty('--tg-theme-text-color', '#1a202c');
            }
            document.getElementById('theme-toggle').innerText = isDark ? '☀️' : '🌙';
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('app-title').innerText = t.title;
            document.getElementById('status-title').innerText = t.statusTitle;
            document.getElementById('loading-text').innerText = t.loading;
            document.getElementById('report-prompt').innerText = t.prompt;
            document.getElementById('report-btn').innerText = t.btnReport;
            document.getElementById('lang-toggle').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            document.getElementById('how-it-works-title').innerText = t.howItWorks;

            if(cachedData) displayScore(cachedData);
        }

        function formatMod(num) {
            return num > 0 ? `+${num}` : `${num}`;
        }

        // Отрисовка атмосферного фона
        function renderAmbientBackground(data) {
            const bg = document.getElementById('ambient-bg');
            bg.innerHTML = ''; 
            
            const score = data.score;
            const f = data.factors || {};

            // 1. Медузы (зависят от общего балла)
            let jellyCount = 0;
            if (score >= 4 && score <= 7) jellyCount = 2;
            else if (score >= 8) jellyCount = 10;

            for (let i = 0; i < jellyCount; i++) {
                const jelly = document.createElement('div');
                jelly.className = 'floating-jelly';
                jelly.innerText = '🪼';
                const size = score >= 8 ? Math.random() * 20 + 20 : 18;
                jelly.style.fontSize = `${size}px`;
                jelly.style.left = `${Math.random() * 85}%`;
                jelly.style.top = `${Math.random() * 80}%`;
                jelly.style.animationDelay = `${Math.random() * 3}s`;
                jelly.style.animationDuration = `${Math.random() * 3 + 3}s`;
                bg.appendChild(jelly);
            }

            // 2. Луна (если балл за луну > 0)
            if (f.astroScore > 0) {
                const moon = document.createElement('div');
                moon.className = 'moon-bg';
                moon.innerText = '🌕';
                bg.appendChild(moon);
            }

            // 3. Ветер (если балл за ветер > 0, рисуем линии ветра)
            if (f.weather > 0) {
                for (let i = 0; i < 4; i++) {
                    const wind = document.createElement('div');
                    wind.className = 'wind-line w-full';
                    wind.style.top = `${Math.random() * 80 + 10}%`;
                    wind.style.animationDelay = `${Math.random() * 2}s`;
                    wind.style.animationDuration = `${Math.random() * 2 + 2}s`;
                    bg.appendChild(wind);
                }
            }
        }

        // Построение списка аккордеона
        function buildFactorsAccordion(factors) {
            const container = document.getElementById('factors-accordion');
            container.innerHTML = '';
            const t = translations[currentLang];
            const template = document.getElementById('accordion-item-template');

            const createItem = (name, valueStr, desc, isBad) => {
                const clone = template.content.cloneNode(true);
                clone.querySelector('.factor-icon-name').innerText = name;
                
                const valEl = clone.querySelector('.factor-val');
                valEl.innerText = valueStr;
                if (isBad) valEl.classList.add('text-red-500');
                else valEl.classList.add('text-blue-500', 'dark:text-blue-400');
                
                clone.querySelector('.factor-desc').innerText = desc;
                container.appendChild(clone);
            };

            // Сезон
            const base = factors.base || 2;
            createItem(t.fSeason, `${base}/10`, base > 2 ? t.seasonHighDesc : t.seasonLowDesc, base > 2);

            // Ветер
            const windScore = factors.weather || 0;
            createItem(t.fWind, formatMod(windScore), windScore > 0 ? t.windBadDesc : t.windGoodDesc, windScore > 0);

            // Луна
            const moonScore = factors.astroScore || 0;
            createItem(t.fMoon, formatMod(moonScore), moonScore > 0 ? t.moonBadDesc : t.moonGoodDesc, moonScore > 0);

            // Отчеты
            const reps = factors.totalReportsToday || 0;
            const socWeight = factors.socialWeight || 0;
            createItem(t.fReports, `${reps} чел. (${formatMod(socWeight)})`, t.reportsDesc, socWeight > 0);
        }

        function displayScore(data) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('result-state').classList.remove('hidden');
            
            const score = data.score;
            const t = translations[currentLang];

            const scoreEl = document.getElementById('danger-score');
            const badgeEl = document.getElementById('danger-badge');
            const descEl = document.getElementById('danger-desc');

            scoreEl.innerText = `${score}/10`;
            scoreEl.className = 'text-7xl font-black mb-3 tracking-tighter relative z-10';
            badgeEl.className = 'text-[11px] px-3 py-1 rounded-full font-bold mb-4 shadow-sm uppercase tracking-wide relative z-10';

            if (score <= 3) {
                scoreEl.classList.add('danger-low');
                badgeEl.classList.add('bg-green-100', 'text-green-800');
                badgeEl.innerText = t.low;
                descEl.innerText = t.descLow;
            } else if (score <= 7) {
                scoreEl.classList.add('danger-med');
                badgeEl.classList.add('bg-yellow-100', 'text-yellow-800');
                badgeEl.innerText = t.med;
                descEl.innerText = t.descMed;
            } else {
                scoreEl.classList.add('danger-high');
                badgeEl.classList.add('bg-red-100', 'text-red-800');
                badgeEl.innerText = t.high;
                descEl.innerText = t.descHigh;
            }

            renderAmbientBackground(data);
            
            if (data.factors) {
                buildFactorsAccordion(data.factors);
            }
        }

        async function fetchStatus() {
            try {
                const res = await fetch(`${API_URL}/api/status`);
                if (!res.ok) throw new Error('API Error');
                cachedData = await res.json();
                displayScore(cachedData);
            } catch (err) {
                console.warn("Fallback active");
                cachedData = { score: 5, factors: { base: 4, weather: 1, astroScore: 0, socialWeight: 0, totalReportsToday: 0 } };
                setTimeout(() => displayScore(cachedData), 1000);
            }
        }

        document.getElementById('report-btn').addEventListener('click', async () => {
            const btn = document.getElementById('report-btn');
            const userId = tg?.initDataUnsafe?.user?.id || 'anon_' + Math.floor(Math.random()*1000);
            btn.disabled = true;
            btn.style.opacity = '0.5';
            
            try {
                await fetch(`${API_URL}/api/report`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId }) 
                });
            } catch (err) {
                console.warn("Report failed");
            } finally {
                document.getElementById('report-thanks').innerText = translations[currentLang].btnThanks;
                document.getElementById('report-thanks').classList.remove('hidden');
                setTimeout(fetchStatus, 1000);
            }
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyTheme();
        });

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            updateTexts();
        });

        applyTheme();
        updateTexts();
        fetchStatus();
    </script>
</body>
</html>
