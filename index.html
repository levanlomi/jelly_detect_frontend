<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jellyfish Detector Da Nang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgBase: 'var(--tg-theme-bg-color, #f5f7fa)',
                        tgText: 'var(--tg-theme-text-color, #1a202c)',
                        tgCard: 'var(--tg-theme-secondary-bg-color, #ffffff)',
                        tgButton: 'var(--tg-theme-button-color, #3b82f6)',
                        tgButtonText: 'var(--tg-theme-button-text-color, #ffffff)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f5f7fa);
            color: var(--tg-theme-text-color, #1a202c);
            transition: background-color 0.3s, color 0.3s;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(128, 128, 128, 0.1);
        }
        .btn-primary {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
            border-radius: 16px;
        }
        .animate-pulse-fast { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        /* Цвета уровней опасности */
        .danger-low { color: #10B981; } 
        .danger-med { color: #F59E0B; } 
        .danger-high { color: #EF4444; } 

        /* Анимация плавного покачивания для медуз на фоне */
        @keyframes floatJelly {
            0% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0.15; }
            50% { transform: translateY(-10px) translateX(5px) rotate(5deg); opacity: 0.35; }
            100% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0.15; }
        }
        .floating-jelly {
            position: absolute;
            animation: floatJelly 4s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold font-sans tracking-tight" id="app-title">Jellyfish Detector Da Nang</h1>
        <div class="flex gap-2">
            <button id="lang-toggle" class="p-2 card text-sm font-bold shadow-sm transition active:scale-95">EN</button>
            <button id="theme-toggle" class="p-2 card shadow-sm transition active:scale-95">🌙</button>
        </div>
    </div>

    <div id="moon-banner" class="w-full max-w-md bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200 p-4 rounded-2xl mb-4 hidden border border-indigo-200 dark:border-indigo-700">
        <div class="flex items-center gap-3">
            <span class="text-2xl">0️</span>
            <p class="text-sm font-medium" id="moon-banner-text">Сизигийный прилив: луна увеличивает вероятность медуз у берега.</p>
        </div>
    </div>

    <div class="card w-full max-w-md p-6 flex flex-col items-center mb-6 relative overflow-hidden min-h-[340px] justify-center">
        
        <div id="jellyfish-bg" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

        <div class="w-full flex justify-center items-center relative z-10 mb-2">
            <h2 id="status-title" class="text-lg font-medium opacity-80">Danger Level</h2>
            <button id="info-btn" class="ml-2 w-5 h-5 rounded-full bg-gray-200 dark:bg-gray-700 text-xs font-bold flex items-center justify-center opacity-70 hover:opacity-100 transition">?</button>
            
            <div id="factors-tooltip" class="hidden absolute top-8 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-4 rounded-xl shadow-xl z-30 w-full max-w-[280px]">
                <div class="space-y-2 text-xs">
                    <div class="flex justify-between"><span id="lbl-season">📅 Сезон</span><span id="v-season" class="font-bold">--</span></div>
                    <div class="flex justify-between"><span id="lbl-wind">💨 Ветер</span><span id="v-wind" class="font-bold">--</span></div>
                    <div class="flex justify-between"><span id="lbl-moon">🌒 Луна</span><span id="v-moon" class="font-bold">--</span></div>
                    <div class="flex justify-between"><span id="lbl-reports">🚨 Отчеты</span><span id="v-reports" class="font-bold">--</span></div>
                </div>
            </div>
        </div>
        
        <div id="loading-state" class="flex flex-col items-center py-8 relative z-10">
            <div class="w-16 h-16 rounded-full border-4 border-gray-200 border-t-blue-500 animate-spin mb-4"></div>
            <p id="loading-text" class="text-sm opacity-60 animate-pulse-fast">Scanning radars...</p>
        </div>

        <div id="result-state" class="hidden flex flex-col items-center w-full relative z-10">
            <div class="text-7xl font-black mb-1 tracking-tighter" id="danger-score">--</div>
            <div class="text-xs px-3 py-0.5 rounded-full font-medium mb-4 shadow-sm" id="danger-badge">Analyzing...</div>
            
            <p class="text-center text-sm font-medium px-2 opacity-90 mb-6 min-h-[40px]" id="danger-desc">--</p>

            <div class="w-full px-2 mt-2">
                <div class="w-full bg-gray-200 dark:bg-gray-700 h-2 rounded-full relative">
                    <div id="scale-pointer" class="w-4 h-4 bg-blue-500 rounded-full absolute -top-1 transition-all duration-500 shadow" style="left: 0%;"></div>
                </div>
                <div class="w-full flex justify-between text-[10px] opacity-40 font-bold mt-1.5 px-0.5">
                    <span>0</span>
                    <span>5</span>
                    <span>10</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card w-full max-w-md p-6 flex flex-col items-center relative z-10">
        <p id="report-prompt" class="text-center mb-4 text-sm font-medium">Did you spot a jellyfish at the beach today?</p>
        <button id="report-btn" class="btn-primary w-full py-3.5 font-bold text-lg transition active:scale-95 shadow-md">
            🚨 Report Jellyfish
        </button>
        <p id="report-thanks" class="text-green-500 text-sm mt-3 hidden font-medium transition-opacity">Thanks! Report recorded in radar.</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // ВАЖНО: Замени на актуальный URL твоего бэкенда на Render
        const API_URL = 'https://jellyfish-backend-2p8f.onrender.com'; 

        const translations = {
            ru: {
                title: "Jellyfish Detector Da Nang",
                statusTitle: "Уровень опасности",
                loading: "Проверяем радары...",
                prompt: "Видели сегодня медузу на пляже?",
                btnReport: "🚨 Я видел медузу",
                btnThanks: "Спасибо! Ваш отчет учтен в радаре.",
                low: "Безопасно",
                med: "Будьте внимательны",
                high: "Апокалипсис",
                moonBanner: "Сизигийный прилив: луна увеличивает вероятность медуз у берега.",
                descLow: "Море полностью безопасно для купания. Отличное время, чтобы поплавать!",
                descMed: "Купаться можно, но посматривайте по сторонам. Возможны редкие медузы.",
                descHigh: "Настоящий медузий апокалипсис! Заходить в воду крайне не рекомендуется.",
                labels: { season: "Сезон", wind: "Ветер", moon: "Луна", reports: "Отчеты" }
            },
            en: {
                title: "Jellyfish Detector Da Nang",
                statusTitle: "Danger Level",
                loading: "Scanning radars...",
                prompt: "Did you spot a jellyfish at the beach today?",
                btnReport: "🚨 I saw a jellyfish",
                btnThanks: "Thanks! Report recorded in radar.",
                low: "Safe",
                med: "Be Careful",
                high: "Apocalypse",
                moonBanner: "Spring tide warning: Moon phase increases jellyfish likelihood near shore.",
                descLow: "The sea is perfectly safe for swimming. Great time to go to the beach!",
                descMed: "Swimming is fine, but keep an eye out. Single jellyfish are possible.",
                descHigh: "True jellyfish apocalypse! Swimming is strongly discouraged.",
                labels: { season: "Season", wind: "Wind", moon: "Moon", reports: "Reports" }
            }
        };

        let currentLang = tg?.initDataUnsafe?.user?.language_code === 'ru' ? 'ru' : 'en';
        let isDark = tg.colorScheme === 'dark';
        if (localStorage.getItem('theme')) isDark = localStorage.getItem('theme') === 'dark';
        
        let cachedData = null;

        function applyTheme() {
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.body.style.setProperty('--tg-theme-bg-color', '#1a202c');
                document.body.style.setProperty('--tg-theme-secondary-bg-color', '#2d3748');
                document.body.style.setProperty('--tg-theme-text-color', '#f5f7fa');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.style.setProperty('--tg-theme-bg-color', '#f5f7fa');
                document.body.style.setProperty('--tg-theme-secondary-bg-color', '#ffffff');
                document.body.style.setProperty('--tg-theme-text-color', '#1a202c');
            }
            document.getElementById('theme-toggle').innerText = isDark ? '☀️' : '🌙';
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('app-title').innerText = t.title;
            document.getElementById('status-title').innerText = t.statusTitle;
            document.getElementById('loading-text').innerText = t.loading;
            document.getElementById('report-prompt').innerText = t.prompt;
            document.getElementById('report-btn').innerText = t.btnReport;
            document.getElementById('moon-banner-text').innerText = t.moonBanner;
            document.getElementById('lang-toggle').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            
            document.getElementById('lbl-season').innerText = `📅 ${t.labels.season}`;
            document.getElementById('lbl-wind').innerText = `💨 ${t.labels.wind}`;
            document.getElementById('lbl-moon').innerText = `🌒 ${t.labels.moon}`;
            document.getElementById('lbl-reports').innerText = `🚨 ${t.labels.reports}`;

            if(cachedData) displayScore(cachedData);
        }

        function formatMod(num) {
            return num > 0 ? `+${num}` : `${num}`;
        }

        // Функция генерации медуз на заднем плане карточки
        function renderJellyfishBackground(score) {
            const bg = document.getElementById('jellyfish-bg');
            bg.innerHTML = ''; // Очищаем старые медузы
            
            let count = 0;
            if (score >= 4 && score <= 7) count = 3;      // Немного медуз
            else if (score >= 8) count = 12;               // Апокалипсис!

            for (let i = 0; i < count; i++) {
                const jelly = document.createElement('div');
                jelly.className = 'floating-jelly';
                jelly.innerText = '🪼';
                
                // Случайный размер и координаты внутри карточки
                const size = score >= 8 ? Math.random() * 20 + 20 : Math.random() * 15 + 15;
                jelly.style.fontSize = `${size}px`;
                jelly.style.left = `${Math.random() * 90}%`;
                jelly.style.top = `${Math.random() * 80}%`;
                
                // Случайная задержка анимации, чтобы двигались несинхронно
                jelly.style.animationDelay = `${Math.random() * 3}s`;
                jelly.style.animationDuration = `${Math.random() * 3 + 3}s`;
                
                bg.appendChild(jelly);
            }
        }

        function displayScore(data) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('result-state').classList.remove('hidden');
            
            const score = data.score;
            const t = translations[currentLang];

            const scoreEl = document.getElementById('danger-score');
            const badgeEl = document.getElementById('danger-badge');
            const descEl = document.getElementById('danger-desc');
            const pointer = document.getElementById('scale-pointer');

            scoreEl.innerText = `${score}/10`;
            
            // Двигаем ползунок по оси (переводим балл в проценты)
            pointer.style.left = `calc(${score * 10}% - 8px)`;

            scoreEl.className = 'text-7xl font-black mb-1 tracking-tighter relative z-10';
            badgeEl.className = 'text-xs px-3 py-0.5 rounded-full font-medium mb-4 shadow-sm relative z-10';

            // Текстовое описание ситуации и цвета
            if (score <= 3) {
                scoreEl.classList.add('danger-low');
                badgeEl.classList.add('bg-green-100', 'text-green-800');
                badgeEl.innerText = t.low;
                descEl.innerText = t.descLow;
            } else if (score <= 7) {
                scoreEl.classList.add('danger-med');
                badgeEl.classList.add('bg-yellow-100', 'text-yellow-800');
                badgeEl.innerText = t.med;
                descEl.innerText = t.descMed;
            } else {
                scoreEl.classList.add('danger-high');
                badgeEl.classList.add('bg-red-100', 'text-red-800');
                badgeEl.innerText = t.high;
                descEl.innerText = t.descHigh;
            }

            // Рендерим фон
            renderJellyfishBackground(score);

            // Наполняем данными скрытый тултип
            if (data.factors) {
                document.getElementById('v-season').innerText = data.factors.base || 2;
                document.getElementById('v-wind').innerText = formatMod(data.factors.weather || 0);
                document.getElementById('v-moon').innerText = formatMod(data.factors.astroScore || 0);
                document.getElementById('v-reports').innerText = `${data.factors.totalReportsToday || 0} (${formatMod(data.factors.socialWeight || 0)})`;

                // Отображение верхнего предупреждающего баннера луны
                const moonBanner = document.getElementById('moon-banner');
                if (data.factors.astroScore > 0) moonBanner.classList.remove('hidden');
                else moonBanner.classList.add('hidden');
            }
        }

        async function fetchStatus() {
            try {
                const res = await fetch(`${API_URL}/api/status`);
                if (!res.ok) throw new Error('API Error');
                cachedData = await res.json();
                displayScore(cachedData);
            } catch (err) {
                console.warn("Fallback active");
                // Имитация данных для локального тестирования
                cachedData = { score: 5, factors: { base: 4, weather: 1, astroScore: 0, socialWeight: 0, totalReportsToday: 0 } };
                setTimeout(() => displayScore(cachedData), 1200);
            }
        }

        // Интерактив для кнопки знака вопроса
        const infoBtn = document.getElementById('info-btn');
        const tooltip = document.getElementById('factors-tooltip');

        infoBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Остановка всплытия, чтобы не срабатывал клик по документу
            tooltip.classList.toggle('hidden');
        });

        // Клик в любое место экрана скрывает тултип факторов
        document.addEventListener('click', () => {
            tooltip.classList.add('hidden');
        });

        document.getElementById('report-btn').addEventListener('click', async () => {
            const btn = document.getElementById('report-btn');
            const userId = tg?.initDataUnsafe?.user?.id || 'anon_' + Math.floor(Math.random()*1000);
            btn.disabled = true;
            btn.style.opacity = '0.5';
            
            try {
                await fetch(`${API_URL}/api/report`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId }) 
                });
            } catch (err) {
                console.warn("Report failed");
            } finally {
                document.getElementById('report-thanks').innerText = translations[currentLang].btnThanks;
                document.getElementById('report-thanks').classList.remove('hidden');
                setTimeout(fetchStatus, 1000);
            }
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyTheme();
        });

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            updateTexts();
        });

        applyTheme();
        updateTexts();
        fetchStatus();
    </script>
</body>
</html>
